<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Echoes of Memory - Gameboy Style</title>
  <style>
    /* Pixelated font from Google Fonts */
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    /* Reset and base styles */
    body {
      background: #6a0dad; /* Purple background inspired by user theme */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Press Start 2P', cursive;
      color: #e0c3fc;
      user-select: none;
    }

  /* Gameboy screen container */
  #gameboy-screen {
    width: 480px;
    height: 432px;
    background: #d0f0c0;
    border: 20px solid #0f380f; /* Increased border thickness */
    border-radius: 20px;
    box-shadow: inset 0 0 30px #0f380f; /* Stronger shadow */
    display: flex;
    flex-direction: column;
    padding: 10px;
    box-sizing: border-box;
  }

    /* Title */
    #title {
      text-align: center;
      font-size: 12px;
      margin-bottom: 8px;
      color: #306230;
      text-shadow: 1px 1px #a0d0a0;
    }

    /* Screen content area */
    #screen-content {
      flex: 1;
      background: #4b0082; /* Dark purple background for screen content */
      border: 4px solid #dda0dd; /* Light purple border */
      border-radius: 8px;
      padding: 8px;
      box-sizing: border-box;
      overflow: hidden;
      position: relative;
      color: #e0c3fc; /* Light purple text */
      font-size: 10px;
      line-height: 12px;
      font-family: 'Press Start 2P', cursive;
    }

    /* Common button style */
    .btn {
      background: #0f380f;
      color: #d0f0c0;
      border: 2px solid #306230;
      padding: 6px 8px;
      font-size: 8px;
      cursor: pointer;
      text-align: center;
      margin: 4px 2px;
      border-radius: 4px;
      user-select: none;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #306230;
    }
    .btn:disabled {
      background: #6b8e23;
      cursor: not-allowed;
    }

  /* Character selection */
  #character-selection {
    display: flex;
    justify-content: space-around;
    margin-top: 10px;
  }
  .character-card {
    width: 80px;
    height: 80px;
    background: #d0f0c0;
    border: 2px solid #0f380f;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 6px;
    cursor: pointer;
    box-shadow: inset 0 0 5px #a0d0a0;
    transition: background 0.2s;
    white-space: pre; /* For pixel art */
    font-family: 'Press Start 2P', cursive;
    color: #306230;
    text-shadow: 1px 1px #a0d0a0;
  }
  .character-card:hover {
    background: #a0d0a0;
  }
  .character-card.selected {
    background: #306230;
    color: #d0f0c0;
      font-weight: bold;
    }

  /* Pixel art for characters in selection */
  .character-prince {
    font-size: 14px;
    line-height: 14px;
  }
  .character-fern {
    font-size: 14px;
    line-height: 14px;
  }
  .character-fawn {
    font-size: 14px;
    line-height: 14px;
  }

    /* Gameplay text */
    #gameplay-text {
      font-size: 8px;
      line-height: 1.2;
      white-space: pre-wrap;
      height: 180px;
      overflow-y: auto;
      padding-right: 4px;
    }

    /* Centered text */
    .center-text {
      text-align: center;
    }

  /* Enemy and collectible pixel art */
  .enemy, .collectible {
    font-family: 'Press Start 2P', cursive;
    font-size: 14px;
    line-height: 14px;
    white-space: pre;
    user-select: none;
    text-shadow: 1px 1px #000000aa;
  }
  .enemy {
    color: #202020;
    text-shadow: 1px 1px #404040;
    animation: float 2s ease-in-out infinite;
  }
  .collectible {
    color: #f0a020;
    text-shadow: 1px 1px #a06000;
    animation: glow 1.5s ease-in-out infinite alternate;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  @keyframes glow {
    0% { text-shadow: 1px 1px 2px #a06000; }
    100% { text-shadow: 1px 1px 8px #f0a020; }
  }

  /* Character sprite container for movement */
  #character-sprite {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 48px;
    height: 48px;
    margin-top: -24px;
    margin-left: -24px;
    font-family: 'Press Start 2P', cursive;
    font-size: 24px;
    line-height: 24px;
    white-space: pre;
    color: #306230;
    text-shadow: 1px 1px #a0d0a0;
    user-select: none;
    pointer-events: none;
  }
  #character-sprite.prince {
    color: #306230;
  }
  #character-sprite.fern {
    color: #a04000;
  }
  #character-sprite.fawn {
    color: #306230;
  }
  </style>
</head>
<body>
  <div id="gameboy-screen" role="main" aria-label="Echoes of Memory Gameboy style game">
    <div id="title">ECHOES OF MEMORY</div>
    <div id="screen-content" tabindex="0" aria-live="polite" aria-atomic="true">
      <!-- Dynamic content will be injected here -->
    </div>
  </div>

  <script>
    // Game state variables
    const screenContent = document.getElementById('screen-content');

    const characters = [
      {
        id: 'prince',
        name: 'Prince of Memories',
        role: 'Puzzle Solver',
        description: 'Solve jigsaw puzzles using memory fragments.',
        pixelArt: 
`  O  
 /|\\ 
 / \\ `
      },
      {
        id: 'fern',
        name: 'Fern',
        role: 'Combat Specialist',
        description: 'Battle dark creatures to free memory fragments.',
        pixelArt: 
`  O  
 /|\\ 
 / \\ `
      },
      {
        id: 'fawn',
        name: 'Fawn',
        role: 'Stealth Navigator',
        description: 'Navigate maze stealthily to escort memory.',
        pixelArt: 
`  O  
 /|\\ 
 / \\ `
      }
    ];

    let selectedCharacter = null;
    let gameStage = 'characterSelection'; // stages: characterSelection, gameRoom, gameplay, memoryGallery

    // Character position for movement in gameplay
    let charPos = { x: 0, y: 0 };
    const moveStep = 10; // pixels per move

    // Initialize game
    function init() {
      renderCharacterSelection();
    }

    // Render character selection screen
    function renderCharacterSelection() {
      gameStage = 'characterSelection';
      screenContent.innerHTML = '';

      const title = document.createElement('div');
      title.className = 'center-text';
      title.style.marginBottom = '8px';
      title.textContent = 'SELECT YOUR CHARACTER';

      const charContainer = document.createElement('div');
      charContainer.id = 'character-selection';

      characters.forEach(char => {
        const card = document.createElement('div');
        card.className = 'character-card';
        card.tabIndex = 0;
        card.setAttribute('role', 'button');
        card.setAttribute('aria-pressed', 'false');
        card.setAttribute('aria-label', `${char.name}, ${char.role}`);
        card.innerHTML = `
          <pre class="character-${char.id}">${char.pixelArt}</pre>
          <div style="font-size:10px; font-weight:bold;">${char.name}</div>
          <div style="font-size:6px; margin-top:4px;">${char.role}</div>
        `;
        card.addEventListener('click', () => selectCharacter(char.id));
        card.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            selectCharacter(char.id);
          }
        });
        charContainer.appendChild(card);
      });

      const startBtn = document.createElement('button');
      startBtn.className = 'btn center-text';
      startBtn.textContent = 'START GAME';
      startBtn.disabled = true;
      startBtn.addEventListener('click', startGame);

      screenContent.appendChild(title);
      screenContent.appendChild(charContainer);
      screenContent.appendChild(startBtn);
    }

    // Handle character selection
    function selectCharacter(charId) {
      selectedCharacter = charId;
      // Update UI to show selected
      const cards = document.querySelectorAll('.character-card');
      cards.forEach(card => {
        card.classList.remove('selected');
        if (card.textContent.includes(characters.find(c => c.id === charId).name)) {
          card.classList.add('selected');
          card.setAttribute('aria-pressed', 'true');
        } else {
          card.setAttribute('aria-pressed', 'false');
        }
      });
      // Enable start button
      const startBtn = screenContent.querySelector('button.btn');
      if (startBtn) startBtn.disabled = false;
    }

    // Start game after character selection
    function startGame() {
      gameStage = 'gameRoom';
      renderGameRoom();
    }

    // Render game room screen
    function renderGameRoom() {
      screenContent.innerHTML = '';

      const title = document.createElement('div');
      title.className = 'center-text';
      title.style.marginBottom = '8px';
      title.textContent = 'GAME ROOM';

      const info = document.createElement('div');
      info.className = 'center-text';
      info.style.fontSize = '8px';
      info.style.marginBottom = '12px';
      info.textContent = 'Waiting for other players to join...';

      const selectedChar = characters.find(c => c.id === selectedCharacter);
      const selectedCharDiv = document.createElement('div');
      selectedCharDiv.className = 'center-text';
      selectedCharDiv.style.fontSize = '8px';
      selectedCharDiv.style.fontWeight = 'bold';
      selectedCharDiv.style.marginBottom = '12px';
      selectedCharDiv.textContent = `You selected: ${selectedChar.name}`;

      const startBtn = document.createElement('button');
      startBtn.className = 'btn center-text';
      startBtn.textContent = 'START LEVEL';
      startBtn.disabled = false;
      startBtn.addEventListener('click', () => {
        renderGameplay();
      });

      screenContent.appendChild(title);
      screenContent.appendChild(info);
      screenContent.appendChild(selectedCharDiv);
      screenContent.appendChild(startBtn);
    }

    // Render gameplay screen based on character
    function renderGameplay() {
      gameStage = 'gameplay';
      screenContent.innerHTML = '';

      const title = document.createElement('div');
      title.className = 'center-text';
      title.style.marginBottom = '8px';
      title.textContent = 'LEVEL 1: RECOVER THE MEMORY';

      const gameplayText = document.createElement('div');
      gameplayText.id = 'gameplay-text';

      const completeBtn = document.createElement('button');
      completeBtn.className = 'btn center-text';
      completeBtn.textContent = 'COMPLETE MISSION';

      completeBtn.addEventListener('click', () => {
        alert('Mission completed! Waiting for other players...');
        renderMemoryGallery();
      });

      screenContent.appendChild(title);
      screenContent.appendChild(gameplayText);
      screenContent.appendChild(completeBtn);

      // Add character sprite for movement
      const charSprite = document.createElement('pre');
      charSprite.id = 'character-sprite';
      charSprite.className = selectedCharacter;
      charSprite.textContent = characters.find(c => c.id === selectedCharacter).pixelArt;
      screenContent.appendChild(charSprite);

      // Initialize character position in center
      charPos.x = (screenContent.clientWidth / 2) - (charSprite.clientWidth / 2);
      charPos.y = (screenContent.clientHeight / 2) - (charSprite.clientHeight / 2);
      updateCharacterPosition();

      // Show mission text based on character
      const missionText = {
        prince: 'Prince of Memories: Solve the jigsaw puzzle by arranging pieces.',
        fern: 'Fern: Battle dark creatures to free memory fragments.',
        fawn: 'Fawn: Navigate the maze stealthily to escort the memory.'
      };
      gameplayText.textContent = missionText[selectedCharacter];

      // Add enemy pixel art
      const enemy = document.createElement('pre');
      enemy.className = 'enemy';
      enemy.textContent = "  ▄▄  \n ▐██▌ \n ▐▀▀▌ \n ▐██▌ \n  ▀▀  ";
      enemy.style.marginTop = '12px';
      gameplayText.appendChild(enemy);

      // Add collectible pixel art
      const collectible = document.createElement('pre');
      collectible.className = 'collectible';
      collectible.textContent = "  ●  \n ●●● \n  ●  ";
      collectible.style.marginTop = '12px';
      gameplayText.appendChild(collectible);
    }

    // Update character sprite position
    function updateCharacterPosition() {
      const charSprite = document.getElementById('character-sprite');
      if (!charSprite) return;
      // Clamp position within screen-content boundaries
      const maxX = screenContent.clientWidth - charSprite.clientWidth;
      const maxY = screenContent.clientHeight - charSprite.clientHeight;
      charPos.x = Math.min(Math.max(0, charPos.x), maxX);
      charPos.y = Math.min(Math.max(0, charPos.y), maxY);
      charSprite.style.left = charPos.x + 'px';
      charSprite.style.top = charPos.y + 'px';
    }

    // Keyboard controls for movement
    const keysPressed = {};

    window.addEventListener('keydown', (e) => {
      keysPressed[e.key] = true;
      if (gameStage === 'gameplay') {
        handleMovement();
      }
    });

    window.addEventListener('keyup', (e) => {
      keysPressed[e.key] = false;
    });

    function handleMovement() {
      let moved = false;
      if (keysPressed['ArrowUp'] || keysPressed['w'] || keysPressed['W']) {
        charPos.y -= moveStep;
        moved = true;
      }
      if (keysPressed['ArrowDown'] || keysPressed['s'] || keysPressed['S']) {
        charPos.y += moveStep;
        moved = true;
      }
      if (keysPressed['ArrowLeft'] || keysPressed['a'] || keysPressed['A']) {
        charPos.x -= moveStep;
        moved = true;
      }
      if (keysPressed['ArrowRight'] || keysPressed['d'] || keysPressed['D']) {
        charPos.x += moveStep;
        moved = true;
      }
      if (moved) {
        updateCharacterPosition();
      }
    }

    // Placeholder for memory gallery screen
    function renderMemoryGallery() {
      gameStage = 'memoryGallery';
      screenContent.innerHTML = '';

      const title = document.createElement('div');
      title.className = 'center-text';
      title.style.marginBottom = '8px';
      title.textContent = 'MEMORY GALLERY';

      const info = document.createElement('div');
      info.className = 'center-text';
      info.style.fontSize = '8px';
      info.textContent = 'Gallery coming soon...';

      screenContent.appendChild(title);
      screenContent.appendChild(info);
    }

    // Initialize game on page load
    window.onload = init;
  </script>
</body>
</html>
